name: ci

on:
  push:
    branches: ["main", "feature/**", "hotfix/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write

jobs:
  python-tests:
    name: Python QA (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest suite
        env:
          PYTEST_ADDOPTS: "--maxfail=1 --disable-warnings --cov=toolkit --cov=qa --cov-report=xml"
        run: pytest -vv

      - name: Upload coverage report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  security-audit:
    name: Security & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bandit
        run: bandit -r toolkit scripts qa -ll

      - name: Codespell
        run: codespell --skip="*.lock,*.svg" --check-filenames --check-hidden .

      - name: ShellCheck
        run: shellcheck scripts/install.sh

      - name: Validate JSON schemas
        run: python -m pytest tests/test_task_validation.py -vv

  extension-build:
    name: Extension Build & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --prefix extensions/smart-task-detector

      - name: Compile Smart Task Detector
        run: npm run compile --prefix extensions/smart-task-detector

      - name: Audit extension dependencies
        run: npm audit --production --prefix extensions/smart-task-detector

  documentation:
    name: Documentation Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate documentation
        run: python -m pytest tests/test_documentation_quality.py -vv

  release-readiness:
    name: Release Readiness
    needs:
      - python-tests
      - security-audit
      - extension-build
      - documentation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Mark release readiness
        run: echo "All required jobs succeeded."
