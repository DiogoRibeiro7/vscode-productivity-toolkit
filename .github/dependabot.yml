version: 2
updates:
  # Python dependencies in root
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "DiogoRibeiro7"
    assignees:
      - "DiogoRibeiro7"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      # Ignore patch updates for stable packages
      - dependency-name: "pytest"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "jsonschema"
        update-types: ["version-update:semver-patch"]

  # Smart Task Detector extension dependencies
  - package-ecosystem: "npm"
    directory: "/extensions/smart-task-detector"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    reviewers:
      - "DiogoRibeiro7"
    assignees:
      - "DiogoRibeiro7"
    commit-message:
      prefix: "deps(extension)"
      include: "scope"
    labels:
      - "dependencies"
      - "typescript"
      - "vscode-extension"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      # Ignore dev dependencies patch updates
      - dependency-name: "@types/*"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-patch"]
    versioning-strategy: "increase"

  # GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    reviewers:
      - "DiogoRibeiro7"
    assignees:
      - "DiogoRibeiro7"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
      - "ci"
    allow:
      - dependency-type: "direct"

  # Docker dependencies (if any Dockerfile dependencies exist)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    reviewers:
      - "DiogoRibeiro7"
    assignees:
      - "DiogoRibeiro7"
    commit-message:
      prefix: "deps(docker)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  # Check for any additional npm dependencies in examples or other directories
  - package-ecosystem: "npm"
    directory: "/examples/sample-projects/react-dashboard"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    reviewers:
      - "DiogoRibeiro7"
    commit-message:
      prefix: "deps(examples)"
      include: "scope"
    labels:
      - "dependencies"
      - "examples"
      - "react"

  # Monitor requirements.txt files in examples
  - package-ecosystem: "pip"
    directory: "/examples/sample-projects/python-data-science"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    reviewers:
      - "DiogoRibeiro7"
    commit-message:
      prefix: "deps(examples)"
      include: "scope"
    labels:
      - "dependencies"
      - "examples"
      - "python"
      - "data-science"
