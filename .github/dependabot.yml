version: 2
updates:
  # Python dependencies in the repository root.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "DiogoRibeiro7"
    assignees:
      - "DiogoRibeiro7"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Root tooling and the Smart Task Detector extension.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/extensions/smart-task-detector"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "DiogoRibeiro7"
    assignees:
      - "DiogoRibeiro7"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "typescript"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    versioning-strategy: "increase"

  # Pre-commit hooks used by the repository.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "DiogoRibeiro7"
    assignees:
      - "DiogoRibeiro7"
    commit-message:
      prefix: "deps(pre-commit)"
      include: "scope"
    labels:
      - "dependencies"
      - "pre-commit"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # GitHub Actions workflow dependencies.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "DiogoRibeiro7"
    assignees:
      - "DiogoRibeiro7"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
      - "ci"
    allow:
      - dependency-type: "direct"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Docker dependencies, when Dockerfiles declare tracked base images.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "DiogoRibeiro7"
    assignees:
      - "DiogoRibeiro7"
    commit-message:
      prefix: "deps(docker)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Maintained React example.
  - package-ecosystem: "npm"
    directory: "/examples/sample-projects/react-dashboard"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    reviewers:
      - "DiogoRibeiro7"
    commit-message:
      prefix: "deps(examples)"
      include: "scope"
    labels:
      - "dependencies"
      - "examples"
      - "react"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Maintained Python data-science example.
  - package-ecosystem: "pip"
    directory: "/examples/sample-projects/python-data-science"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    reviewers:
      - "DiogoRibeiro7"
    commit-message:
      prefix: "deps(examples)"
      include: "scope"
    labels:
      - "dependencies"
      - "examples"
      - "python"
      - "data-science"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
