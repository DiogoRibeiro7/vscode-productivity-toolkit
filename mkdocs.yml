site_name: VS Code Productivity Toolkit
site_description: Curated VS Code tasks and project detection for developer workspaces
site_url: https://diogoribeiro7.github.io/vscode-productivity-toolkit/
repo_url: https://github.com/DiogoRibeiro7/vscode-productivity-toolkit
repo_name: DiogoRibeiro7/vscode-productivity-toolkit
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Python CLI: python-cli.md
      - Task catalog: task-reference.md
      - Customize tasks: customization-examples.md
      - Troubleshooting: troubleshooting.md
      - FAQ: faq.md
  - Project:
      - Architecture: architecture.md
      - Quality assurance: quality-assurance.md
      - Development: development.md
      - Contributing: contributing.md
      - Documentation map: README.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
