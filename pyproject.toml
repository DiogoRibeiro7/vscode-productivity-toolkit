[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vscode-productivity-toolkit"
version = "1.0.0"
description = "Enterprise-grade VS Code automation toolkit with curated tasks, smart project detection, and seamless integration"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt"}
]
maintainers = [
    {name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Text Editors :: Integrated Development Environments (IDE)",
    "Topic :: Utilities",
]
keywords = [
    "vscode",
    "productivity",
    "automation",
    "development-tools",
    "python",
    "javascript",
    "react",
    "nodejs",
    "docker",
    "git",
    "data-science",
    "enterprise",
    "quality-assurance",
    "linting",
    "testing",
    "ci-cd"
]
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0,<9.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "requests>=2.28.0,<3.0.0",
    "pathspec>=0.11.0,<1.0.0",
    "jsonschema>=4.17.0,<5.0.0",
    "packaging>=21.0,<26.0",
    "rich>=13.0.0,<15.0.0",
    "typing-extensions>=4.0.0",
    "importlib-metadata>=4.0.0; python_version < '3.10'",
    "tomli>=2.0.0; python_version < '3.11'"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<8.0.0",
    "pytest-mock>=3.10.0,<4.0.0",
    "black>=23.0.0,<26.0.0",
    "isort>=5.12.0,<7.0.0",
    "flake8>=6.0.0,<7.0.0",
    "mypy>=1.0.0,<2.0.0",
    "bandit>=1.7.0,<2.0.0",
    "pre-commit>=3.0.0,<4.0.0",
    "tox>=4.0.0,<5.0.0"
]
docs = [
    "mkdocs>=1.4.0,<2.0.0",
    "mkdocs-material>=9.0.0,<10.0.0",
    "mkdocs-include-markdown-plugin>=6.0.0,<7.0.0"
]
server = [
    "watchdog>=3.0.0,<7.0.0",
    "livereload>=2.6.0,<3.0.0"
]

[project.scripts]
vscode-toolkit = "toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/DiogoRibeiro7/vscode-productivity-toolkit"
Documentation = "https://github.com/DiogoRibeiro7/vscode-productivity-toolkit/tree/main/docs"
Repository = "https://github.com/DiogoRibeiro7/vscode-productivity-toolkit.git"
Issues = "https://github.com/DiogoRibeiro7/vscode-productivity-toolkit/issues"
Changelog = "https://github.com/DiogoRibeiro7/vscode-productivity-toolkit/blob/main/CHANGELOG.md"
Funding = "mailto:dfr@esmad.ipp.pt"

[tool.setuptools]
packages = ["toolkit"]
include-package-data = true

[tool.setuptools.package-data]
toolkit = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | node_modules
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["toolkit"]
known_third_party = ["click", "pydantic", "requests", "pytest"]

[tool.flake8]
max-line-length = 88
extend-ignore = [
    "E203",  # whitespace before ':'
    "E501",  # line too long (handled by black)
    "W503",  # line break before binary operator
]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".tox",
    "node_modules"
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=toolkit",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
    "--cov-fail-under=85"
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "network: marks tests that require network access",
    "unit: marks tests as unit tests"
]

[tool.coverage.run]
source = ["toolkit"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101", "B601"]  # Skip assert_used and shell_injection for tests
